[project]
name = "accelerator"
version = "0.1.0"
description = "Agentic workflow accelerator demo package"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.0.0",
  "requests>=2.31.0",
  "pytest>=8.0.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["accelerator"]
