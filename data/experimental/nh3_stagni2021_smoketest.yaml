name: NH3_Stagni2021_SmokeTest
source: "10.1016/j.combustflame.2021.111530"

# NOTE: measured_value fields are approximate placeholders for smoke test.
# Real values must be read from paper figures before scientific use.
# observable is NH3 mole fraction remaining after reaction.
# General trend: higher T = more NH3 consumed = lower remaining fraction.

conditions:
  - reactor_type: shock_tube
    temperature_K: 2217.0
    pressure_atm: 1.22
    mixture:
      "NH3(1)": 0.0045
      Ar: 0.9955
    observable_type: species_profile
    observable_label: "NH3(1)"
    measured_value: 0.0001
    error_threshold: 0.0002

